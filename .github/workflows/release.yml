name: Build and publish MeshMap release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Test platform compatibility
        run: go test ./...

  release:
    needs: compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Build Linux, macOS, and Windows binaries
        run: make release

      - name: Package downloads
        run: |
          mkdir -p release
          for arch in amd64 arm64 armv7; do
            tar -czf "release/meshmap-linux-${arch}.tar.gz" \
              -C dist "meshmap-linux-${arch}" \
              -C "$GITHUB_WORKSPACE" \
              deploy/meshmap.service README.md CHANGELOG.md DIAGNOSTICS.md \
              LICENSE THIRD_PARTY_LICENSES schema.sql
          done
          for arch in amd64 arm64; do
            tar -czf "release/meshmap-macos-${arch}.tar.gz" \
              -C dist "meshmap-macos-${arch}" \
              -C "$GITHUB_WORKSPACE" \
              README.md CHANGELOG.md DIAGNOSTICS.md \
              LICENSE THIRD_PARTY_LICENSES schema.sql
          done
          zip -q -j "release/meshmap-windows-amd64.zip" \
            dist/meshmap-windows-amd64.exe \
            README.md CHANGELOG.md DIAGNOSTICS.md LICENSE schema.sql
          zip -q -r "release/meshmap-windows-amd64.zip" \
            THIRD_PARTY_LICENSES

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip \
              --verify-tag --generate-notes
          fi
