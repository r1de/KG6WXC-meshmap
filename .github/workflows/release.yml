name: Build and publish MeshMap release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Build Linux binaries
        run: make release

      - name: Package downloads
        run: |
          mkdir -p release
          for arch in amd64 arm64 armv7; do
            tar -czf "release/meshmap-${GITHUB_REF_NAME}-linux-${arch}.tar.gz" \
              -C dist "meshmap-linux-${arch}" \
              -C "$GITHUB_WORKSPACE" \
              deploy/meshmap.service README.md CHANGELOG.md DIAGNOSTICS.md \
              LICENSE THIRD_PARTY_LICENSES schema.sql
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.tar.gz \
              --verify-tag --generate-notes
          fi
